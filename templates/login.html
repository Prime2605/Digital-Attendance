{% extends "base.html" %}

{% block title %}Login - Smart Attendance{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card glass-panel">
        <div class="login-header">
            <div class="login-icon">
                <i class="fas fa-lock"></i>
            </div>
            <h1>Welcome Back</h1>
            <p>Sign in to continue to Smart Attendance</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}" class="login-form">
            <div class="form-group">
                <label for="email">
                    <i class="fas fa-envelope"></i> Email Address
                </label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    class="form-input"
                    placeholder="Enter your email"
                    required
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="password">
                    <i class="fas fa-key"></i> Password
                </label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-input"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="btn-primary btn-login">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <div class="login-footer">
            <div class="demo-credentials">
                <h3><i class="fas fa-info-circle"></i> Demo Credentials</h3>
                <div class="demo-grid">
                    <div class="demo-item">
                        <strong>Staff:</strong>
                        <span>staff@example.com / staff123</span>
                    </div>
                    <div class="demo-item">
                        <strong>Student:</strong>
                        <span>student@example.com / student123</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
